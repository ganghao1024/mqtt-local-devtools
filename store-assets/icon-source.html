<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MQTT Local DevTools Icon</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: transparent; }
      body { display: grid; place-items: start; }
      #icon {
        width: 128px;
        height: 128px;
        display: grid;
        place-items: center;
        border-radius: 26px;
        background: #238636;
        color: #fff;
      }
      svg {
        width: 66%;
        height: 66%;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <div id="icon" aria-label="MQTT Local DevTools">
      <svg viewBox="0 0 24 24">
        <path d="M7 12a5 5 0 0 1 8.8-3.2M17 12a5 5 0 0 1-8.8 3.2" />
        <path d="m14.4 6.8 1.8 2.1-2.7.7M9.6 17.2l-1.8-2.1 2.7-.7" />
      </svg>
    </div>
  </body>
</html>
