<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MQTT Local DevTools Icon</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; background: #172131; color: #e8eef7; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
      p { margin: 0 0 28px; color: #a1b1c7; font-size: 13px; }
      .samples { display: flex; align-items: end; gap: 32px; }
      figure { display: grid; justify-items: center; gap: 12px; margin: 0; }
      img { display: block; }
      figcaption { font-size: 12px; color: #a1b1c7; }
    </style>
  </head>
  <body>
    <h1>MQTT Local DevTools</h1>
    <p>深色底 · 蓝青脉冲线</p>
    <div class="samples">
      <figure><img src="../icons/icon.svg" width="128" height="128" alt="矢量源图标" /><figcaption>SVG 源文件</figcaption></figure>
      <figure><img src="../icons/icon128.png" width="128" height="128" alt="128 像素图标" /><figcaption>128 × 128</figcaption></figure>
      <figure><img src="../icons/icon48.png" width="48" height="48" alt="48 像素图标" /><figcaption>48 × 48</figcaption></figure>
      <figure><img src="../icons/icon32.png" width="32" height="32" alt="32 像素图标" /><figcaption>32 × 32</figcaption></figure>
      <figure><img src="../icons/icon16.png" width="16" height="16" alt="16 像素图标" /><figcaption>16 × 16</figcaption></figure>
    </div>
  </body>
</html>
